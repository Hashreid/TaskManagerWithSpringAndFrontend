<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Планировщик задач</title>
    <!-- Подключаем Tailwind CSS для красивого и современного оформления -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

<!-- Шапка страницы -->
<header class="bg-indigo-600 text-white shadow-md py-4 px-6">
    <h1 class="text-2xl font-bold">TaskManager 🚀</h1>
    <p class="text-indigo-200 text-sm">Управление задачами и напоминаниями</p>
</header>

<!-- Основной рабочий контейнер -->
<main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">

    <!-- Левая панель: Управление задачами -->
    <aside class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col gap-4">
        <h2 class="text-lg font-semibold text-gray-700 border-b pb-2">Управление</h2>
        <button onclick="openModal('add')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg transition duration-200 shadow-sm">
            ➕ Добавить задачу
        </button>
        <button onclick="openModal('edit')" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-medium py-2.5 px-4 rounded-lg transition duration-200 shadow-sm">
            ✏️ Изменить задачу
        </button>
        <button onclick="deleteTask()" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-medium py-2.5 px-4 rounded-lg transition duration-200 shadow-sm">
            🗑️ Удалить задачу
        </button>
        <div class="mt-auto bg-gray-50 p-4 rounded-lg border text-xs text-gray-500">
            <p>💡 <strong>Подсказка:</strong> Кликайте по дням в календаре, чтобы просматривать задачи на конкретную дату.</p>
        </div>
    </aside>

    <!-- Центр: Календарь -->
    <section class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col">
        <div class="flex justify-between items-center mb-6">
            <h2 id="month-year" class="text-xl font-bold text-gray-800">Ноябрь 2026</h2>
            <div class="flex gap-2">
                <button onclick="changeMonth(-1)" class="p-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm font-semibold transition">&larr;</button>
                <button onclick="changeMonth(1)" class="p-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm font-semibold transition">&rarr;</button>
            </div>
        </div>

        <!-- Дни недели -->
        <div class="grid grid-cols-7 gap-2 text-center text-xs font-semibold text-gray-400 mb-2">
            <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
        </div>

        <!-- Сетка дней календаря -->
        <div id="calendar-grid" class="grid grid-cols-7 gap-2 flex-1">
            <!-- Дни генерируются через JS -->
        </div>
    </section>

    <!-- Правая панель: Настройки напоминаний -->
    <aside class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col gap-5">
        <h2 class="text-lg font-semibold text-gray-700 border-b pb-2">Напоминания</h2>

        <div class="flex items-center justify-between bg-gray-50 p-3 rounded-lg border">
            <span class="text-sm font-medium text-gray-700">Статус</span>
            <span id="reminder-status" class="px-2.5 py-1 text-xs font-semibold bg-emerald-100 text-emerald-700 rounded-full">Включено</span>
        </div>

        <div class="flex gap-2">
            <button onclick="toggleReminder(true)" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium py-2 rounded-lg transition">
                Включить
            </button>
            <button onclick="toggleReminder(false)" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 text-sm font-medium py-2 rounded-lg transition">
                Отключить
            </button>
        </div>

        <div class="flex flex-col gap-2">
            <label for="recurrence-select" class="text-sm font-medium text-gray-700">Цикличность:</label>
            <select id="recurrence-select" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5">
                <option value="none">Без повтора</option>
                <option value="week">Каждую неделю</option>
                <option value="month">Каждый месяц</option>
                <option value="year">Каждый год</option>
            </select>
        </div>

        <button onclick="saveRemindersSettings()" class="mt-auto bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg transition">
            Сохранить настройки
        </button>
    </aside>

</main>

<!-- Простой скрипт для демонстрации интерфейса календаря -->
<script>
    const calendarGrid = document.getElementById('calendar-grid');
    const monthYearLabel = document.getElementById('month-year');

    let currentDate = new Date();

    // Пример дней с задачами (в будущем данные будут приходить с твоего Spring Boot бэкенда)
    const tasksDays = [5, 12, 15, 22];

    function renderCalendar() {
        calendarGrid.innerHTML = '';
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        const monthsNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        monthYearLabel.innerText = `${monthsNames[month]} ${year}`;

        // Первый день месяца
        let firstDayIndex = new Date(year, month, 1).getDay();
        firstDayIndex = firstDayIndex === 0 ? 6 : firstDayIndex - 1; // Сдвиг под понедельник

        // Количество дней в текущем месяце
        const totalDays = new Date(year, month + 1, 0).getDate();

        // Пустые ячейки для дней предыдущего месяца
        for (let i = 0; i < firstDayIndex; i++) {
            const emptyDiv = document.createElement('div');
            calendarGrid.appendChild(emptyDiv);
        }

        // Заполнение дней месяца
        for (let day = 1; day <= totalDays; day++) {
            const dayDiv = document.createElement('div');
            dayDiv.className = `h-20 border rounded-lg p-2 flex flex-col justify-between items-start transition cursor-pointer hover:bg-indigo-50 ${tasksDays.includes(day) ? 'bg-indigo-50/60 border-indigo-200' : 'bg-white border-gray-100'}`;

            let html = `<span class="text-sm font-semibold text-gray-700">${day}</span>`;

            // Если на этот день есть задача, рисуем индикатор
            if (tasksDays.includes(day)) {
                html += `<span class="bg-indigo-600 text-white text-[10px] px-1.5 py-0.5 rounded-full font-medium">Задача</span>`;
            }

            dayDiv.innerHTML = html;
            dayDiv.onclick = () => alert(`Выбран день: ${day} ${monthsNames[month]} ${year}`);
            calendarGrid.appendChild(dayDiv);
        }
    }

    function changeMonth(direction) {
        currentDate.setMonth(currentDate.getMonth() + direction);
        renderCalendar();
    }

    function openModal(action) {
        alert(`Открытие модального окна для действия: ${action}`);
    }

    function deleteTask() {
        alert('Функция удаления выбранной задачи');
    }

    function toggleReminder(enable) {
        const statusBadge = document.getElementById('reminder-status');
        if (enable) {
            statusBadge.className = "px-2.5 py-1 text-xs font-semibold bg-emerald-100 text-emerald-700 rounded-full";
            statusBadge.innerText = "Включено";
        } else {
            statusBadge.className = "px-2.5 py-1 text-xs font-semibold bg-rose-100 text-rose-700 rounded-full";
            statusBadge.innerText = "Отключено";
        }
    }

    function saveRemindersSettings() {
        const recurrence = document.getElementById('recurrence-select').value;
        alert(`Настройки напоминаний сохранены. Цикличность: ${recurrence}`);
    }

    renderCalendar();
</script>
</body>
</html>
