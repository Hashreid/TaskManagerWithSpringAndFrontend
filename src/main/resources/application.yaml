spring:
  application:
    name: springtaskmanager

  datasource:
    url: jdbc:postgresql://localhost:5432/task_manager_db
    username: postgres
    password: hashpost
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
